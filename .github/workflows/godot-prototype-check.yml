name: Godot Prototype Check

on:
  push:
    branches:
      - worldwake-painter-prototype
  workflow_dispatch:

jobs:
  boot-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        godot_version:
          - 4.2.2
          - 4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot ${{ matrix.godot_version }}
        run: |
          VERSION="${{ matrix.godot_version }}"
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${VERSION}-stable_linux.x86_64"

      - name: Parse project in editor mode
        run: |
          VERSION="${{ matrix.godot_version }}"
          "./Godot_v${VERSION}-stable_linux.x86_64" --headless --path . --editor --quit

      - name: Boot main scene briefly
        run: |
          VERSION="${{ matrix.godot_version }}"
          "./Godot_v${VERSION}-stable_linux.x86_64" --headless --path . --quit-after 4
