name: Godot Prototype Check

on:
  push:
    branches:
      - worldwake-painter-prototype
  workflow_dispatch:

jobs:
  boot-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.2.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64

      - name: Parse project in editor mode
        run: |
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Boot main scene briefly
        run: |
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --path . --quit-after 4
